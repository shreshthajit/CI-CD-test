steps:
  # 1. Build the Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Convert repo name to lowercase inline using command substitution
        docker build -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/$(echo "${_REPO_NAME}" | tr '[:upper:]' '[:lower:]')/python-app:$SHORT_SHA -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/$(echo "${_REPO_NAME}" | tr '[:upper:]' '[:lower:]')/python-app:latest .

  # 2. Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Convert repo name to lowercase inline using command substitution
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/$(echo "${_REPO_NAME}" | tr '[:upper:]' '[:lower:]')/python-app:$SHORT_SHA
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/$(echo "${_REPO_NAME}" | tr '[:upper:]' '[:lower:]')/python-app:latest

  # 3. Deploy to VM (SSH and run Docker)
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Convert repo name to lowercase and construct image path inline
        # Use $$ to escape shell variables from Cloud Build substitution
        REPO_LOW=$$(echo "${_REPO_NAME}" | tr '[:upper:]' '[:lower:]')
        IMAGE_FULL="${_REGION}-docker.pkg.dev/$PROJECT_ID/$${REPO_LOW}/python-app:latest"
        gcloud compute ssh ${_VM_NAME} --zone=${_VM_ZONE} --command="sudo gcloud auth configure-docker ${_REGION}-docker.pkg.dev --quiet; sudo docker stop python-backend 2>/dev/null || true; sudo docker rm python-backend 2>/dev/null || true; sudo docker pull $${IMAGE_FULL} && sudo docker run -d -p 8080:8080 --name python-backend $${IMAGE_FULL}"

# Options for Cloud Build
options:
  logging: CLOUD_LOGGING_ONLY
  # Use default logs bucket behavior for custom service accounts
  default_logs_bucket_behavior: REGIONAL_USER_OWNED_BUCKET

# Substitution variables - these can be overridden in Cloud Build trigger settings
substitutions:
  _REGION: 'us-central1'
  _REPO_NAME: 'python-backend-repo'
  _VM_ZONE: 'us-central1-a'
  _VM_NAME: 'python-backend-vm'
