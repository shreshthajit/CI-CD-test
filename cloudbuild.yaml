steps:
  # 0. Convert repo name to lowercase (Docker requirement)
  - name: 'bash'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Convert repo name to lowercase and export for next steps
        REPO_LOWER=$(echo "${_REPO_NAME}" | tr '[:upper:]' '[:lower:]')
        echo "REPO_LOWER=${REPO_LOWER}" >> /workspace/repo_env.txt
        cat /workspace/repo_env.txt
  
  # 1. Build the Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        REPO=$(grep REPO_LOWER /workspace/repo_env.txt | cut -d= -f2)
        docker build -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/$REPO/python-app:$SHORT_SHA -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/$REPO/python-app:latest .

  # 2. Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        REPO=$(grep REPO_LOWER /workspace/repo_env.txt | cut -d= -f2)
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/$REPO/python-app:$SHORT_SHA
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/$REPO/python-app:latest

  # 3. Deploy to VM (SSH and run Docker)
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        REPO=$(grep REPO_LOWER /workspace/repo_env.txt | cut -d= -f2)
        gcloud compute ssh ${_VM_NAME} --zone=${_VM_ZONE} --command="docker stop python-backend 2>/dev/null || true; docker rm python-backend 2>/dev/null || true; docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/$REPO/python-app:latest; docker run -d -p 8080:8080 --name python-backend ${_REGION}-docker.pkg.dev/$PROJECT_ID/$REPO/python-app:latest"

# Options for Cloud Build
options:
  logging: CLOUD_LOGGING_ONLY
  # Use default logs bucket behavior for custom service accounts
  default_logs_bucket_behavior: REGIONAL_USER_OWNED_BUCKET

# Substitution variables - these can be overridden in Cloud Build trigger settings
substitutions:
  _REGION: 'us-central1'
  _REPO_NAME: 'python-backend-repo'
  _VM_ZONE: 'us-central1-a'
  _VM_NAME: 'python-backend-vm'