steps:
  # 1. Build the Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/python-app:$SHORT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/python-app:latest'
      - '.'

  # 2. Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/python-app:$SHORT_SHA'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/python-app:latest'

  # 3. Deploy to VM (SSH and run Docker)
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Construct image name using Cloud Build substitution variables
        IMAGE_NAME="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/python-app:latest"
        # SSH into the VM and run deployment commands
        # Use $VAR syntax (not ${VAR}) for shell variables to avoid Cloud Build substitution parsing
        gcloud compute ssh ${_VM_NAME} --zone=${_VM_ZONE} --command="
          CONTAINER_NAME='python-backend'
          IMAGE_NAME='${IMAGE_NAME}'
          if [ \$(docker ps -aq -f name=\$CONTAINER_NAME) ]; then
            docker stop \$CONTAINER_NAME
            docker rm \$CONTAINER_NAME
          fi
          docker pull \$IMAGE_NAME
          docker run -d -p 8080:8080 --name \$CONTAINER_NAME \$IMAGE_NAME
        "

# Options for Cloud Build
options:
  logging: CLOUD_LOGGING_ONLY
  # Use default logs bucket behavior for custom service accounts
  default_logs_bucket_behavior: REGIONAL_USER_OWNED_BUCKET

# Substitution variables - these can be overridden in Cloud Build trigger settings
substitutions:
  _REGION: 'us-central1'
  _REPO_NAME: 'python-backend-repo'
  _VM_ZONE: 'us-central1-a'
  _VM_NAME: 'python-backend-vm'