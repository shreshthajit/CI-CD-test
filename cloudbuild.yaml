steps:
  # 1. Build the Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/python-app:$SHORT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/python-app:latest'
      - '.'

  # 2. Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/python-app:$SHORT_SHA'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/python-app:latest'

  # 3. Deploy to VM (SSH and run Docker)
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Construct the full deployment command with image name inline
        # This avoids Cloud Build parsing any $VAR patterns in the remote command
        gcloud compute ssh ${_VM_NAME} --zone=${_VM_ZONE} --command="
          if [ \$(docker ps -aq -f name=python-backend) ]; then
            docker stop python-backend && docker rm python-backend
          fi
          docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/python-app:latest
          docker run -d -p 8080:8080 --name python-backend ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/python-app:latest
        "

# Options for Cloud Build
options:
  logging: CLOUD_LOGGING_ONLY
  # Use default logs bucket behavior for custom service accounts
  default_logs_bucket_behavior: REGIONAL_USER_OWNED_BUCKET

# Substitution variables - these can be overridden in Cloud Build trigger settings
substitutions:
  _REGION: 'us-central1'
  _REPO_NAME: 'python-backend-repo'
  _VM_ZONE: 'us-central1-a'
  _VM_NAME: 'python-backend-vm'